plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
    lockAllConfigurations()
}

application {
    mainClass = 'tetris.Main'
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// 이번에 구현한 보드와 블록 네 클래스는 각각 실행 코드 줄의 70% 이상을 테스트한다.
def boardAndPieceCoverageVerification = tasks.register(
        'boardAndPieceCoverageVerification', JacocoCoverageVerification) {
    dependsOn test
    executionData test
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        include 'tetris/board/Board.class'
        include 'tetris/piece/PieceQueue.class'
        include 'tetris/piece/PieceType.class'
        include 'tetris/piece/Tetromino.class'
    })
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn boardAndPieceCoverageVerification

// 새로 구현한 게임 엔진과 상태·처리 결과도 클래스마다 같은 기준으로 검사한다.
def gameEngineCoverageVerification = tasks.register(
        'gameEngineCoverageVerification', JacocoCoverageVerification) {
    dependsOn test
    executionData test
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        include 'tetris/game/GameEngine.class'
        include 'tetris/game/GameState.class'
        include 'tetris/game/GameActionResult.class'
        include 'tetris/game/CenteredPieceSpawnPolicy.class'
        include 'tetris/game/GameAction.class'
        include 'tetris/game/GamePhase.class'
    })
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn gameEngineCoverageVerification

// Run after combining the settings, Swing UI and app-control branches.
sourceSets {
    reviewIntegration {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    reviewIntegrationImplementation.extendsFrom testImplementation
    reviewIntegrationRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('reviewIntegrationTest', Test) {
    description = 'Verifies the combined PR #7, #8 and #11 menu, settings and restart flow.'
    group = 'verification'
    testClassesDirs = sourceSets.reviewIntegration.output.classesDirs
    classpath = sourceSets.reviewIntegration.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}
tasks.register('reviewWindowTest', Test) {
    description = 'Checks real window focus and Swing key event handling after combining the three PRs.'
    group = 'verification'
    testClassesDirs = sourceSets.reviewIntegration.output.classesDirs
    classpath = sourceSets.reviewIntegration.runtimeClasspath
    useJUnitPlatform()
    include '**/ReviewWindow*Test.class'
    systemProperty 'java.awt.headless', 'false'
}
tasks.named('reviewIntegrationTest') {
    exclude '**/ReviewWindow*Test.class'
    exclude '**/GameplayPerformanceTest.class'
}

// Opt-in local measurements: keep machine-dependent performance budgets out of regular CI.
tasks.register('gameplayPerformanceTest', Test) {
    description = 'Measures gameplay input, snapshots and painting across sizes with a 256 MiB heap.'
    group = 'verification'
    testClassesDirs = sourceSets.reviewIntegration.output.classesDirs
    classpath = sourceSets.reviewIntegration.runtimeClasspath
    useJUnitPlatform()
    include '**/GameplayPerformanceTest.class'
    systemProperty 'java.awt.headless', 'true'
    maxHeapSize = '256m'
}

// Verify the assembled app's headless integration flow in normal builds and CI.
tasks.named('check') { dependsOn tasks.named('reviewIntegrationTest') }

plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
    lockAllConfigurations()
}

application {
    mainClass = 'tetris.Main'
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Req2 중간평가: 직접 작성한 전체 실행 코드의 줄 커버리지 50% 이상.
// UI와 Main도 포함하며, 기존 핵심 클래스별 70% 검사와 함께 실행한다.
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification

// 이번에 구현한 보드와 블록 네 클래스는 각각 실행 코드 줄의 70% 이상을 테스트한다.
def boardAndPieceCoverageVerification = tasks.register(
        'boardAndPieceCoverageVerification', JacocoCoverageVerification) {
    dependsOn test
    executionData test
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        include 'tetris/board/Board.class'
        include 'tetris/piece/PieceQueue.class'
        include 'tetris/piece/PieceType.class'
        include 'tetris/piece/Tetromino.class'
    })
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn boardAndPieceCoverageVerification

// 새로 구현한 게임 엔진과 상태·처리 결과도 클래스마다 같은 기준으로 검사한다.
def gameEngineCoverageVerification = tasks.register(
        'gameEngineCoverageVerification', JacocoCoverageVerification) {
    dependsOn test
    executionData test
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        include 'tetris/game/GameEngine.class'
        include 'tetris/game/GameState.class'
        include 'tetris/game/GameActionResult.class'
        include 'tetris/game/CenteredPieceSpawnPolicy.class'
        include 'tetris/game/GameAction.class'
        include 'tetris/game/GamePhase.class'
    })
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

check.dependsOn gameEngineCoverageVerification

// Run after combining the settings, Swing UI and app-control branches.
sourceSets {
    reviewIntegration {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    reviewIntegrationImplementation.extendsFrom testImplementation
    reviewIntegrationRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('reviewIntegrationTest', Test) {
    description = 'Verifies the combined PR #7, #8 and #11 menu, settings and restart flow.'
    group = 'verification'
    testClassesDirs = sourceSets.reviewIntegration.output.classesDirs
    classpath = sourceSets.reviewIntegration.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}
tasks.register('reviewWindowTest', Test) {
    description = 'Checks real window focus and Swing key event handling after combining the three PRs.'
    group = 'verification'
    testClassesDirs = sourceSets.reviewIntegration.output.classesDirs
    classpath = sourceSets.reviewIntegration.runtimeClasspath
    useJUnitPlatform()
    include '**/ReviewWindow*Test.class'
    systemProperty 'java.awt.headless', 'false'
}
tasks.named('reviewIntegrationTest') {
    exclude '**/ReviewWindow*Test.class'
    exclude '**/GameplayPerformanceTest.class'
}

// Opt-in local measurements: keep machine-dependent performance budgets out of regular CI.
tasks.register('gameplayPerformanceTest', Test) {
    description = 'Measures gameplay input, snapshots and painting across sizes with a 256 MiB heap.'
    group = 'verification'
    testClassesDirs = sourceSets.reviewIntegration.output.classesDirs
    classpath = sourceSets.reviewIntegration.runtimeClasspath
    useJUnitPlatform()
    include '**/GameplayPerformanceTest.class'
    systemProperty 'java.awt.headless', 'true'
    maxHeapSize = '256m'
}

// Verify the assembled app's headless integration flow in normal builds and CI.
tasks.named('check') { dependsOn tasks.named('reviewIntegrationTest') }

tasks.register('verifyImports', JavaExec) {
    description = 'Rejects unused imports in production, unit and review integration sources.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'tetris.quality.ImportAudit'
    args file('src').absolutePath,
            (sourceSets.test.compileClasspath + sourceSets.reviewIntegration.compileClasspath).asPath
}
tasks.named('check') { dependsOn tasks.named('verifyImports') }

tasks.register('prepareMacosInput', Sync) {
    into layout.buildDirectory.dir('packaging/macos/input')
    from tasks.named('jar')
    from configurations.runtimeClasspath
}

tasks.register('packageMacos', Exec) {
    description = 'Builds a double-clickable macOS app with its icon and Java runtime, then zips it.'
    group = 'distribution'
    dependsOn tasks.named('prepareMacosInput')
    doFirst {
        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')) {
            throw new GradleException('packageMacos must run on macOS with JDK 21.')
        }
        def packageDirectory = layout.buildDirectory.dir('macos').get().asFile
        delete packageDirectory
        commandLine '/bin/bash', file('packaging/macos/package.sh').absolutePath,
                javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile.absolutePath,
                layout.buildDirectory.dir('packaging/macos/input').get().asFile.absolutePath,
                tasks.named('jar').get().archiveFileName.get(), packageDirectory.absolutePath
    }
}

 
// Windows packages are reproducible build outputs, not version-controlled binaries.
tasks.register('prepareWindowsInput', Sync) {
    into layout.buildDirectory.dir('packaging/windows/input')
    from tasks.named('jar')
    from configurations.runtimeClasspath
}

tasks.register('packageWindows', Exec) {
    description = 'Builds a Windows x64 executable with a bundled Java 21 runtime and ZIP archive.'
    group = 'distribution'
    dependsOn tasks.named('prepareWindowsInput')
    doFirst {
        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            throw new GradleException('packageWindows must run on Windows x64 with JDK 21.')
        }
        def packageDirectory = layout.buildDirectory.dir('windows').get().asFile
        delete packageDirectory
        commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', file('packaging/windows/package.ps1').absolutePath,
                javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile.absolutePath,
                layout.buildDirectory.dir('packaging/windows/input').get().asFile.absolutePath,
                tasks.named('jar').get().archiveFileName.get(), packageDirectory.absolutePath
    }
}

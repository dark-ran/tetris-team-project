name: Package Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/main/**'
      - 'packaging/windows/**'
      - '*gradle*'
      - 'gradle/**'
      - '.github/workflows/package-windows.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/**'
      - 'packaging/windows/**'
      - '*gradle*'
      - 'gradle/**'
      - '.github/workflows/package-windows.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Verify and package
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean build jacocoTestReport packageWindows
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Tetris-windows-x64
          path: |
            build/windows/Tetris-windows-x64.zip
            build/windows/Tetris-windows-x64.zip.sha256
          if-no-files-found: error

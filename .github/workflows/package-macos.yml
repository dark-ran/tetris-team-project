name: Package macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/main/**'
      - 'packaging/macos/**'
      - '*gradle*'
      - 'gradle/**'
      - '.github/workflows/package-macos.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/**'
      - 'packaging/macos/**'
      - '*gradle*'
      - 'gradle/**'
      - '.github/workflows/package-macos.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Verify and package
        run: ./gradlew --no-daemon clean build jacocoTestReport packageMacos
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: Tetris-macos-${{ runner.arch }}
          path: |
            build/macos/Tetris-macos-*.zip
            build/macos/Tetris-macos-*.sha256
          if-no-files-found: error
